name: inventory-pro

services:
  postgres:
    image: postgres:17
    container_name: inventory-pro-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: inventory_pro
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - inventory_network

  redis:
    image: redis:8-alpine
    container_name: inventory-pro-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - inventory_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inventory-pro-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inventorypro.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - inventory_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  inventory_network:
    driver: bridge